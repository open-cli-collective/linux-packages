name: Receive Package

on:
  repository_dispatch:
    types: [package-release]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package name (e.g., cfl)'
        required: true
      version:
        description: 'Version tag (e.g., v0.10.0)'
        required: true
      repo:
        description: 'Source repo (e.g., open-cli-collective/confluence-cli)'
        required: true

concurrency:
  group: linux-package-repository-update
  cancel-in-progress: false

jobs:
  update-repos:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Support both repository_dispatch and workflow_dispatch
      PACKAGE: ${{ github.event.client_payload.package || inputs.package }}
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      REPO: ${{ github.event.client_payload.repo || inputs.repo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c libarchive-tools pacman-package-manager
          command -v repo-add

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LINUX_PACKAGES_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.LINUX_PACKAGES_GPG_PASSPHRASE }}
        run: |
          # Configure GPG for non-interactive use
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          # Create passphrase file for gpg-agent
          echo "$GPG_PASSPHRASE" > ~/.gnupg/passphrase
          chmod 600 ~/.gnupg/passphrase

          # Configure gpg and gpg-agent
          cat > ~/.gnupg/gpg.conf << 'GPGCONF'
          use-agent
          batch
          pinentry-mode loopback
          passphrase-file /home/runner/.gnupg/passphrase
          GPGCONF

          cat > ~/.gnupg/gpg-agent.conf << 'AGENTCONF'
          allow-loopback-pinentry
          allow-preset-passphrase
          AGENTCONF

          # Restart gpg-agent
          gpgconf --kill gpg-agent || true

          # Import the key
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Get the key ID
          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=$KEY_ID" >> $GITHUB_ENV

          # Test signing works
          echo "test" | gpg --batch --sign > /dev/null 2>&1 && echo "GPG signing test passed" || echo "GPG signing test failed"

      - name: Download packages from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ./downloads

          echo "Downloading packages for $PACKAGE version $VERSION from $REPO"

          for pattern in \
            "${PACKAGE}_*.deb" \
            "${PACKAGE}_*.rpm" \
            "${PACKAGE}_*.pkg.tar.zst"; do
            gh release download "$VERSION" \
              --repo "$REPO" \
              --pattern "$pattern" \
              --dir ./downloads || echo "No files found for $pattern"
          done

          if compgen -G './downloads/*' > /dev/null; then
            echo "Downloaded files:"
            ls -la ./downloads/
          else
            echo "No files downloaded"
          fi

      - name: Update APT repository
        run: |
          if ls ./downloads/*.deb 1> /dev/null 2>&1; then
            echo "Adding .deb packages to APT repository"

            for deb in ./downloads/*.deb; do
              echo "Adding $deb"
              reprepro -b apt includedeb stable "$deb"
            done

            echo "APT repository updated"
          else
            echo "No .deb packages to add"
          fi

      - name: Update RPM repository
        run: |
          if ls ./downloads/*.rpm 1> /dev/null 2>&1; then
            echo "Adding .rpm packages to RPM repository"

            # Copy RPM files
            cp ./downloads/*.rpm rpm/packages/

            # Sign RPM packages
            for rpm in rpm/packages/*.rpm; do
              if [ -f "$rpm" ]; then
                echo "Signing $rpm"
                rpm --addsign "$rpm" || echo "Warning: Could not sign $rpm (rpm signing may not be configured)"
              fi
            done

            # Regenerate repo metadata
            createrepo_c --update rpm/packages

            # Sign the repo metadata
            gpg --batch --yes --detach-sign --armor rpm/packages/repodata/repomd.xml

            echo "RPM repository updated"
          else
            echo "No .rpm packages to add"
          fi

      - name: Update Arch Linux repository
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(./downloads/*.pkg.tar.zst)

          if (( ${#packages[@]} == 0 )); then
            echo "No Arch Linux packages to add"
            exit 0
          fi

          for package in "${packages[@]}"; do
            package_arch=$(bsdtar -xOf "$package" .PKGINFO |
              awk -F ' = ' '$1 == "arch" { print $2; exit }')
            case "$package_arch" in
              x86_64|aarch64) ;;
              *)
                echo "Unsupported Arch Linux package architecture: $package_arch" >&2
                exit 1
                ;;
            esac

            repo_dir="arch/$package_arch"
            mkdir -p "$repo_dir"

            cp "$package" "$repo_dir/"
            package_name=$(basename "$package")
            (
              cd "$repo_dir"
              gpg --batch --yes --detach-sign "$package_name"
              repo-add --remove --sign --key "$GPG_KEY_ID" \
                open-cli-collective.db.tar.gz "$package_name"
            )
          done

          echo "Arch Linux repository updated"

      - name: Cleanup downloads
        run: rm -rf ./downloads

      - name: Commit and push
        run: |
          git config user.name "Open CLI Collective"
          git config user.email "open-cli@googlegroups.com"
          git config user.signingkey "$GPG_KEY_ID"
          git config commit.gpgsign true

          git add -A

          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            git commit -m "feat: update $PACKAGE to $VERSION"
            git push
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

      - name: Trigger Pages deployment
        if: env.HAS_CHANGES == 'true'
        env:
          GH_TOKEN: ${{ secrets.LINUX_PACKAGES_DISPATCH_TOKEN }}
        run: |
          # Trigger pages workflow since push from workflow doesn't trigger other workflows
          gh workflow run pages.yml
